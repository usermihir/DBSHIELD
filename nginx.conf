events {
    worker_connections 1024;
}

http {
    # Round-robin across all 'backend' service replicas (resolved by Docker DNS)
    upstream dbshield_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Pass real client IP to backend so rate limiting tracks actual IPs
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
            proxy_pass         http://dbshield_backend;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
